<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mauricio Moya</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink: #f5f3ee; --shade: rgba(10, 12, 16, .55); }
  html, body { margin: 0; background: #0a0c10; color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #track { position: relative; }
  #stage { position: sticky; top: 0; display: block; width: 100%; height: 100vh; height: 100dvh; }
  #caption { position: fixed; left: max(16px, 6vw); bottom: max(24px, 10vh); max-width: min(560px, 88vw);
    padding: 20px 24px; border-radius: 14px; background: var(--shade); backdrop-filter: blur(8px);
    opacity: 0; transform: translateY(12px); transition: opacity .45s ease, transform .45s ease; pointer-events: none; }
  #caption.on { opacity: 1; transform: none; }
  #caption h2 { margin: 0 0 6px; font-size: clamp(22px, 3.2vw, 38px); line-height: 1.15; }
  #caption p { margin: 0; font-size: clamp(15px, 1.4vw, 18px); }
  #error { padding: 24px; }
  #home { position: fixed; top: max(16px, env(safe-area-inset-top)); left: max(16px, 4vw); z-index: 2; color: var(--ink);
    background: var(--shade); padding: 8px 14px; border-radius: 999px; text-decoration: none; font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { #caption { transition: none; } }
</style>
</head>
<body>
<a id="home" href="../">Home</a>
<main id="dive" hidden>
  <div id="track"><canvas id="stage" aria-hidden="true"></canvas></div>
  <section id="caption" aria-live="polite"><h2></h2><p></p></section>
</main>
<p id="error" hidden></p>
<script src="engine.js"></script>
</body>
</html>
