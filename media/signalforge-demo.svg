<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
<title id="title">SignalForge: a slow, readable four-stage intelligence workflow</title>
<desc id="description">An illustrative 20-second animation with a stable screen. A user-provided video JSON and an opt-in GitHub API query flow into a SignalForge intelligence core. Four phases appear sequentially: collect, compare with the creator baseline, validate sources and output a read-only research lead. Video results use synthetic 21-item data, 100 median views and an 8.0 times outlier. No malware scan, growth prediction or time-savings benchmark is claimed.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#100c26"/><stop offset="1" stop-color="#18143b"/></linearGradient>
  <linearGradient id="eye" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#55e1df"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#845cf6"/><stop offset="1" stop-color="#4fe6d2"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="4"/></filter>
</defs>
<rect width="960" height="540" rx="24" fill="url(#bg)"/>
