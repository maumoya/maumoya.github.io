<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">GrantPRO — a VISION product</title>
  <desc id="d">Animated card: a timesheet line is coded to a grant, passes an eligibility check and is sealed into the audit trail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f2a1e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eab308"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/><stop offset=".5" stop-color="#22c55e" stop-opacity=".35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <style>
      .f{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .row{opacity:0;animation:in 9s infinite}
      .r1{animation-delay:.3s}.r2{animation-delay:1.1s}.r3{animation-delay:1.9s}.r4{animation-delay:2.7s}
      .ok{opacity:0;animation:ok 9s infinite}
      .o1{animation-delay:1.5s}.o2{animation-delay:2.3s}.o3{animation-delay:3.1s}.o4{animation-delay:3.9s}
      .seal{opacity:0;transform-origin:1005px 455px;animation:seal 9s infinite;animation-delay:4.6s}
      .scan{animation:scan 9s infinite linear}
      .pulse{animation:pulse 3s infinite ease-in-out}
      @keyframes in{0%{opacity:0;transform:translateX(-14px)}6%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
      @keyframes ok{0%{opacity:0}5%,85%{opacity:1}93%,100%{opacity:0}}
      @keyframes seal{0%{opacity:0;transform:scale(1.4)}5%,70%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(1)}}
      @keyframes scan{0%{transform:translateY(0)}55%{transform:translateY(240px)}100%{transform:translateY(240px);opacity:0}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.row,.ok,.seal{animation:none;opacity:1}.scan,.pulse{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Brand -->
  <g class="f">
    <rect x="70" y="70" width="64" height="64" rx="16" fill="url(#brand)"/>
    <text x="102" y="102" dy=".35em" text-anchor="middle" font-weight="800" font-size="34" fill="#fff">G</text>
    <text x="156" y="100" font-weight="800" font-size="46" fill="#f8fafc">GrantPRO</text>
    <text x="158" y="128" font-size="17" fill="#94a3b8" letter-spacing="3">A VISION PRODUCT</text>
    <text x="70" y="200" font-size="27" fill="#e2e8f0">The grants-finance business OS for</text>
    <text x="70" y="236" font-size="27" fill="#e2e8f0">grant-funded nonprofits.</text>
    <text x="70" y="276" font-size="19" fill="#86efac">Modular · Auditable · Rules decide, AI proposes</text>
  </g>

  <!-- Flow chips -->
  <g class="f" font-size="16" font-weight="600">
    <g class="pulse"><rect x="70" y="330" width="150" height="40" rx="20" fill="#1e293b" stroke="#334155"/><text x="145" y="355" text-anchor="middle" fill="#fde68a">Timesheet</text></g>
    <path d="M226 350h28" stroke="#475569" stroke-width="2"/>
    <g class="pulse" style="animation-delay:.6s"><rect x="262" y="330" width="150" height="40" rx="20" fill="#1e293b" stroke="#334155"/><text x="337" y="355" text-anchor="middle" fill="#fde68a">Grant coding</text></g>
    <path d="M418 350h28" stroke="#475569" stroke-width="2"/>
    <g class="pulse" style="animation-delay:1.2s"><rect x="454" y="330" width="150" height="40" rx="20" fill="#1e293b" stroke="#334155"/><text x="529" y="355" text-anchor="middle" fill="#bbf7d0">Eligibility</text></g>
    <g class="pulse" style="animation-delay:1.8s"><rect x="70" y="390" width="200" height="40" rx="20" fill="#1e293b" stroke="#334155"/><text x="170" y="415" text-anchor="middle" fill="#bbf7d0">Audit trail</text></g>
  </g>

  <g class="f" font-size="15" fill="#64748b">
    <text x="70" y="520">Finance first → Compliance → Operations → Procurement → HR → Programs → Executive</text>
    <text x="70" y="560">Creator: VISION · Legal owner: [LLC name to be entered]</text>
  </g>

  <!-- Ledger panel -->
  <g class="f">
    <rect x="690" y="150" width="440" height="360" rx="20" fill="#0b1324" stroke="#1f2a44"/>
    <text x="720" y="190" font-size="15" font-weight="700" fill="#94a3b8" letter-spacing="2">PAY PERIOD · LABOR LINES</text>
    <g clip-path="url(#panel)">
      <rect class="scan" x="700" y="205" width="420" height="44" fill="url(#sweep)"/>
    </g>
    <g font-size="17">
      <g class="row r1"><rect x="710" y="210" width="400" height="44" rx="10" fill="#111c33"/><text x="730" y="238" fill="#e2e8f0">Case management · 16.0 h</text><text x="1050" y="238" fill="#fde68a" text-anchor="end">Grant A</text></g>
      <g class="row r2"><rect x="710" y="264" width="400" height="44" rx="10" fill="#111c33"/><text x="730" y="292" fill="#e2e8f0">Job services · 12.0 h</text><text x="1050" y="292" fill="#fde68a" text-anchor="end">Grant B</text></g>
      <g class="row r3"><rect x="710" y="318" width="400" height="44" rx="10" fill="#111c33"/><text x="730" y="346" fill="#e2e8f0">Housing support · 8.0 h</text><text x="1050" y="346" fill="#fde68a" text-anchor="end">Grant A</text></g>
      <g class="row r4"><rect x="710" y="372" width="400" height="44" rx="10" fill="#111c33"/><text x="730" y="400" fill="#e2e8f0">Admin · 4.0 h</text><text x="1050" y="400" fill="#fde68a" text-anchor="end">Indirect</text></g>
    </g>
    <g font-size="20" font-weight="800" fill="#22c55e">
      <text class="ok o1" x="1088" y="239" text-anchor="middle">✓</text>
      <text class="ok o2" x="1088" y="293" text-anchor="middle">✓</text>
      <text class="ok o3" x="1088" y="347" text-anchor="middle">✓</text>
      <text class="ok o4" x="1088" y="401" text-anchor="middle">✓</text>
    </g>
    <g class="seal">
      <rect x="880" y="436" width="230" height="44" rx="22" fill="#14532d" stroke="#22c55e"/>
      <text x="995" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#bbf7d0">Locked · audit-ready</text>
    </g>
  </g>
  <defs><clipPath id="panel"><rect x="700" y="200" width="420" height="230"/></clipPath></defs>
</svg>
